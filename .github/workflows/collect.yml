name: Collect stats

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      full_stars:
        description: "Refetch all stargazers instead of only the newest pages"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_STARS: ${{ inputs.full_stars && '--full-stars' || '' }}
        run: uv run --locked collect.py $FULL_STARS

      - name: Render
        run: uv run --locked render.py

      - name: Commit if changed
        run: |
          git add data charts README.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(stats): update $(date -u +%Y-%m-%d)"
          git push
